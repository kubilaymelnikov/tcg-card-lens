<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session</title>
<!--
  Session-Anzeige für den Pack-Opening-Modus – als OBS-Browser-Quelle frei in der Szene platzierbar.
  URL-Parameter:
    source=<Name der OBS-Quelle mit dem Filter>   (ohne: erste Quelle mit aktivem Pack-Opening)
    show=total,hits,count                          (Standard: total,hits)
    hits=3                                         Anzahl letzter Hits
    scale=1                                        Schriftgröße
    align=left|right                               Ausrichtung
    bg=0|1                                         halbtransparenter Hintergrund (Standard 1)
    lang=de|en                                     Sprache (Standard: OBS-Sprache aus der Engine)
  Hintergrund der Seite ist transparent.
-->
<style>
  :root { --scale: 1; --gold: #f5c542; --text: #f3f4f7; --muted: #b6bac6; --panel: rgba(16, 18, 24, .78); }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body {
    font: 600 calc(22px * var(--scale)) / 1.25 "Segoe UI", system-ui, sans-serif; color: var(--text);
    text-shadow: 0 2px 4px rgba(0, 0, 0, .65);
  }
  .wrap { display: flex; flex-direction: column; align-items: flex-start; gap: calc(8px * var(--scale)); padding: calc(10px * var(--scale)); }
  body.right .wrap { align-items: flex-end; text-align: right; }
  .box {
    display: inline-flex; flex-direction: column; gap: calc(4px * var(--scale));
    padding: calc(10px * var(--scale)) calc(16px * var(--scale)); border-radius: calc(12px * var(--scale));
  }
  body.bg .box { background: var(--panel); box-shadow: 0 4px 18px rgba(0, 0, 0, .35); }
  .label { font-size: .62em; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .total { font-size: 2em; font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; }
  .count { font-size: .7em; color: var(--muted); font-weight: 600; }
  .hits { display: flex; flex-direction: column; gap: calc(4px * var(--scale)); }
  .hit { display: flex; gap: calc(10px * var(--scale)); align-items: center; font-size: .8em; }
  body.right .hit { flex-direction: row-reverse; }
  .hit img {
    width: calc(34px * var(--scale)); height: calc(47px * var(--scale)); object-fit: cover;
    border-radius: calc(3px * var(--scale)); box-shadow: 0 1px 4px rgba(0, 0, 0, .5); background: #333;
  }
  .hit .n { max-width: calc(260px * var(--scale)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hit .p { color: var(--gold); font-variant-numeric: tabular-nums; }
  .empty { font-size: .7em; color: var(--muted); font-weight: 500; }
  [hidden] { display: none !important; }

  /* Hit-Animation */
  .flash { animation: flash 2.6s ease-out; }
  @keyframes flash {
    0% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(245, 197, 66, 0)); }
    12% { transform: scale(1.12); filter: drop-shadow(0 0 18px rgba(245, 197, 66, .95)); }
    40% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(245, 197, 66, .6)); }
    100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(245, 197, 66, 0)); }
  }
  .banner {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.6); opacity: 0;
    font-size: 1.6em; font-weight: 900; color: #1b1300; white-space: nowrap; pointer-events: none;
    background: linear-gradient(135deg, #ffe07a, #f5b316); padding: .35em .9em; border-radius: .5em;
    box-shadow: 0 0 30px rgba(245, 197, 66, .8); text-shadow: none;
  }
  .banner.show { animation: banner 2.8s ease-out forwards; }
  @keyframes banner {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); }
    12% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    25% { transform: translate(-50%, -50%) scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
  }
</style>
</head>
<body class="bg">
<div class="wrap">
  <div class="box" id="totalBox">
    <span class="label" id="lblTotal">Session-Wert</span>
    <span class="total" id="total">–</span>
    <span class="count" id="count"></span>
  </div>
  <div class="box" id="hitsBox">
    <span class="label" id="lblHits">Letzte Hits</span>
    <div class="hits" id="hits"><span class="empty" id="none">noch keine</span></div>
  </div>
</div>
<div class="banner" id="banner"></div>
<script>
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var want = q.get('source');
  var show = (q.get('show') || 'total,hits').split(',');
  var nHits = Math.max(1, Math.min(10, parseInt(q.get('hits') || '3', 10) || 3));
  document.documentElement.style.setProperty('--scale', String(parseFloat(q.get('scale') || '1') || 1));
  if (q.get('align') === 'right') document.body.classList.add('right');
  if (q.get('bg') === '0') document.body.classList.remove('bg');

  var el = function (id) { return document.getElementById(id); };
  el('totalBox').hidden = show.indexOf('total') < 0;
  el('hitsBox').hidden = show.indexOf('hits') < 0;
  el('count').hidden = show.indexOf('count') < 0 && show.indexOf('total') < 0;

  // Sprache: ?lang=de|en, sonst die der Quelle (ui_language aus /api/state = OBS-Sprache), sonst Deutsch
  var TEXT = {
    de: { total: 'Session-Wert', hits: 'Letzte Hits', none: 'noch keine', card_one: 'Karte', card_many: 'Karten',
          hit_one: 'Hit', hit_many: 'Hits' },
    en: { total: 'Session value', hits: 'Recent hits', none: 'none yet', card_one: 'card', card_many: 'cards',
          hit_one: 'hit', hit_many: 'hits' }
  };
  var urlLang = (q.get('lang') || '').toLowerCase();
  urlLang = urlLang === 'de' || urlLang === 'en' ? urlLang : null;
  var lang = null, T = TEXT.de, euro = null;
  function normLang(v) { return typeof v === 'string' && v ? (v.toLowerCase().indexOf('de') === 0 ? 'de' : 'en') : null; }
  function setLang(l) {
    if (l === lang) return;
    lang = l;
    T = TEXT[l];
    document.documentElement.lang = l;
    euro = new Intl.NumberFormat(l === 'de' ? 'de-DE' : 'en-US', { style: 'currency', currency: 'EUR' });
    el('lblTotal').textContent = T.total;
    el('lblHits').textContent = T.hits;
    var none = el('none');
    if (none) none.textContent = T.none;
    lastSig = '';
  }
  var seenHits = null; // Eintrags-IDs bereits gezeigter Hits (erste Abfrage löst keine Animation aus)
  var lastSig = '';
  setLang(urlLang || 'de');

  function pick(sessions) {
    var withPack = sessions.filter(function (s) { return s && s.pack; });
    if (want) return withPack.filter(function (s) { return s.source === want; })[0] || null;
    return withPack.filter(function (s) { return s.pack.enabled; })[0] || withPack[0] || null;
  }

  function render(pack) {
    var total = pack ? pack.total || 0 : 0;
    var cards = pack ? pack.cards || [] : [];
    var hits = cards.filter(function (c) { return c.hit; });
    var sig = JSON.stringify([total, cards.length, hits.slice(0, nHits).map(function (c) { return c.id; })]);
    if (sig === lastSig) return hits;
    lastSig = sig;
    el('total').textContent = euro.format(total);
    el('count').textContent = cards.length + ' ' + (cards.length === 1 ? T.card_one : T.card_many) +
      (hits.length ? ' · ' + hits.length + ' ' + (hits.length === 1 ? T.hit_one : T.hit_many) : '');
    var box = el('hits');
    box.textContent = '';
    if (!hits.length) {
      var e = document.createElement('span'); e.className = 'empty'; e.id = 'none'; e.textContent = T.none; box.appendChild(e);
    }
    hits.slice(0, nHits).forEach(function (c) {
      var row = document.createElement('div'); row.className = 'hit';
      var img = document.createElement('img'); img.alt = ''; if (c.image) img.src = c.image;
      img.onerror = function () { img.removeAttribute('src'); };
      var n = document.createElement('span'); n.className = 'n'; n.textContent = c.name || '?';
      var p = document.createElement('span'); p.className = 'p'; p.textContent = c.price != null ? euro.format(c.price) : '';
      row.appendChild(img); row.appendChild(n); row.appendChild(p); box.appendChild(row);
    });
    return hits;
  }

  function celebrate(card) {
    var b = el('banner');
    b.textContent = 'HIT! ' + (card.name || '') + (card.price != null ? ' · ' + euro.format(card.price) : '');
    b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
    ['totalBox', 'hitsBox'].forEach(function (id) {
      var x = el(id); x.classList.remove('flash'); void x.offsetWidth; x.classList.add('flash');
    });
  }

  var busy = false;
  function poll() {
    if (busy) return;
    busy = true;
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 3000);
    // overlay=1: zählt nicht als „Dock offen“ (sonst stünden die Kennzeichen A, B … dauerhaft im Video)
    fetch('/api/state?overlay=1' + (urlLang ? '&lang=' + urlLang : ''), { cache: 'no-store', signal: ctl ? ctl.signal : undefined })
      .then(function (r) { return r.json(); })
      .then(function (s) {
        var sess = pick(Array.isArray(s.sessions) ? s.sessions : []);
        if (!urlLang) {
          var l = normLang(sess && sess.ui_language) || normLang(s.ui_language);
          if (l) setLang(l);
        }
        var hits = render(sess ? sess.pack : null);
        var ids = hits.map(function (c) { return c.id; });
        if (seenHits !== null) {
          var fresh = hits.filter(function (c) { return seenHits.indexOf(c.id) < 0; });
          if (fresh.length) celebrate(fresh[0]);
        }
        seenHits = ids;
      })
      .catch(function () { /* Engine kurz weg: letzten Stand stehen lassen */ })
      .then(function () { clearTimeout(timer); busy = false; });
  }
  poll();
  setInterval(poll, 700);
})();
</script>
</body>
</html>
