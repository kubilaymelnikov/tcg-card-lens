<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karten</title>
<style>
:root {
  --bg: #1e1f25;
  --panel: #25272f;
  --tile: #2b2e38;
  --tile-hi: #323644;
  --border: #3a3e4b;
  --text: #e6e8ee;
  --muted: #9aa0ad;
  --dim: #6f7583;
  --accent: #4c8df0;
  --accent-2: #2f6fd6;
  --ok: #3fb950;
  --warn: #f0b429;
  --bad: #f2564b;
  --hl: #ffd75a;
  --radius: 6px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
body {
  font: 13px/1.35 "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  min-width: 260px;
}
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---------- Kopf ---------- */
header {
  position: sticky; top: 0; z-index: 5;
  background: var(--panel); border-bottom: 1px solid var(--border);
  padding: 6px 8px; display: flex; flex-direction: column; gap: 5px;
}
.hrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.status { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1 1 auto; }
.status-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
.dot.ok { background: var(--ok); box-shadow: 0 0 6px rgba(63,185,80,.6); }
.dot.err { background: var(--bad); }
.dot.warn { background: var(--warn); }
.learned { color: var(--muted); white-space: nowrap; font-size: 12px; }
.learned b { color: var(--text); font-weight: 600; }
.ctrl { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; }
.ctrl select {
  background: var(--tile); border: 1px solid var(--border); border-radius: 4px;
  padding: 2px 4px; max-width: 170px;
}
.ctrl input[type=checkbox] { accent-color: var(--accent); margin: 0; }
.ctrl label { display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; }
.spacer { flex: 1 1 auto; }

.offline {
  margin: 6px 8px 0; padding: 5px 8px; border-radius: var(--radius);
  background: rgba(242,86,75,.12); border: 1px solid rgba(242,86,75,.35); color: #ffb3ad; font-size: 12px;
}
main { padding: 6px 8px 8px; transition: opacity .2s; }
main.stale { opacity: .55; }

/* ---------- Abschnitte ---------- */
section { margin-top: 6px; }
h2 {
  margin: 4px 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); display: flex; align-items: center; gap: 6px;
}
h2 .count {
  background: var(--tile); border: 1px solid var(--border); border-radius: 9px; padding: 0 6px;
  font-size: 11px; letter-spacing: 0; color: var(--text);
}
#sec-confirm h2 { color: var(--warn); }
#sec-confirm h2 .count { background: rgba(240,180,41,.15); border-color: rgba(240,180,41,.45); }
.grid { display: grid; gap: 6px; align-items: start; }
.grid-confirm { grid-template-columns: repeat(auto-fill, minmax(min(100%, 262px), 1fr)); }
.grid-seen { grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
.empty { color: var(--dim); font-size: 12px; padding: 14px 4px; text-align: center; }

/* ---------- Kacheln ---------- */
.tile {
  background: var(--tile); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 6px; min-width: 0; outline: none; transition: border-color .15s, box-shadow .15s, background .15s;
}
.tile:hover, .tile:focus-within { background: var(--tile-hi); border-color: #4a5060; }
.tile:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
.tile.hl { border-color: var(--hl); box-shadow: 0 0 0 1px var(--hl), 0 0 10px rgba(255,215,90,.25); }
.tile.busy { opacity: .7; cursor: progress; }
.tile-confirm { border-color: rgba(240,180,41,.55); background: linear-gradient(180deg, rgba(240,180,41,.08), transparent 70px), var(--tile); }
.tile { position: relative; }
/* ✕ oben rechts: Karte ohne Angabe von Gründen ausblenden */
.tile .close {
  position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 50%;
  background: rgba(229,72,77,.15); color: #ff5a5f; font-size: 13px; font-weight: 700; line-height: 20px; cursor: pointer; z-index: 2;
}
.tile .close:hover, .tile .close:focus-visible { opacity: 1; background: #e5484d; color: #fff; }
.tile-confirm .ct-head { padding-right: 22px; }
.tile-compact .cm-info { padding-right: 18px; }
/* Karte fehlt gerade in /api/state bzw. ist "rejected": letzter Inhalt bleibt, aber ausgegraut. */
.tile.gone { border-style: dashed; }
.tile.gone .compare, .tile.gone .info, .tile.gone .ct-head .badge,
.tile.gone .cm > .badge, .tile.gone .cm > .img, .tile.gone .cm-info > .name, .tile.gone .cm-info > .meta {
  opacity: .4; filter: grayscale(1);
}
.tile.checking .compare { opacity: .8; }
.note { color: var(--warn); font-size: 11px; font-style: italic; white-space: nowrap; }
.ct-q .sub { display: flex; gap: 6px; min-height: 15px; min-width: 0; overflow: hidden; font-size: 11px; }
.compare { position: relative; }
.newsug {
  position: absolute; z-index: 2; border: 1px solid var(--accent); background: rgba(30,31,37,.94); color: #cfe0ff;
  border-radius: 4px; font-size: 11px; padding: 3px 8px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.45);
}
.newsug:hover { background: #2a3550; }
.compare .newsug { left: 4px; right: 4px; bottom: 22px; }
.tile-compact .newsug { right: 4px; top: 4px; }

.badge {
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  min-width: 22px; height: 22px; padding: 0 5px; border-radius: 5px;
  background: var(--accent); color: #fff; font-weight: 700; font-size: 13px; line-height: 1;
}
.badge-lg { min-width: 38px; height: 38px; font-size: 22px; border-radius: 7px; background: var(--warn); color: #1e1f25; }
.tile.hl .badge { background: var(--hl); color: #1e1f25; }

.img {
  position: relative; aspect-ratio: 63 / 88; width: 100%; border-radius: 4px; overflow: hidden;
  background: #22242b; border: 1px solid #343846;
}
.img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.img.missing img { visibility: hidden; }
.img.missing::after {
  content: ""; position: absolute; inset: 18% 22%; border: 2px dashed #3d4250; border-radius: 4px;
}

/* Bestätigen */
.ct-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.ct-q { flex: 1 1 auto; min-width: 0; }
.ct-q .q { font-weight: 600; font-size: 14px; }
.ct-q .src { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sim { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--warn); white-space: nowrap; }
.sim small { color: var(--muted); font-weight: 400; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.compare figure { margin: 0; min-width: 0; }
.compare figcaption { text-align: center; color: var(--muted); font-size: 11px; margin-top: 2px; }
.info { margin-top: 6px; min-width: 0; }
.name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile-confirm .name { font-size: 14px; }
.meta { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reason { color: #d9b866; font-size: 12px; margin-top: 2px; }
.actions { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; align-items: center; }
.hint {
  padding: 4px 8px; border-radius: 4px; background: rgba(240,180,41,.15); color: var(--warn);
  font-weight: 600; font-size: 12px;
}

.btn {
  border: 1px solid var(--border); background: #353946; border-radius: 4px; padding: 4px 10px;
  cursor: pointer; white-space: nowrap; line-height: 1.3;
}
.btn:hover:not(:disabled) { background: #3f4453; border-color: #52586a; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent-2); border-color: var(--accent); color: #fff; font-weight: 600; min-width: 56px; }
.btn.primary:hover:not(:disabled) { background: var(--accent); }
.btn.danger { color: #ffb3ad; }
.btn.sm { padding: 2px 7px; font-size: 12px; }
.btn.icon { padding: 2px 7px; font-size: 13px; }
.btn[aria-expanded=true] { background: #424859; }

/* Erkannt (kompakt) */
.cm { display: grid; grid-template-columns: auto 50px minmax(0, 1fr); gap: 7px; align-items: start; }
.cm .img { width: 50px; }
.cm-info { min-width: 0; }
.cm-line { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin-top: 2px; font-size: 12px; }
.price { font-weight: 600; font-variant-numeric: tabular-nums; }
.price.none { color: var(--dim); font-weight: 400; }
.chg { font-variant-numeric: tabular-nums; font-size: 11px; }
.chg.up { color: var(--ok); }
.chg.down { color: var(--bad); }
.chg.flat { color: var(--muted); }
.tag { font-size: 10px; padding: 0 5px; border-radius: 8px; border: 1px solid; line-height: 15px; white-space: nowrap; }
.tag.confirmed { color: var(--ok); border-color: rgba(63,185,80,.5); }
.tag.learned { color: #8ab8ff; border-color: rgba(76,141,240,.5); }
.tag.unsure { color: var(--warn); border-color: rgba(240,180,41,.5); }
.tag.failed { color: var(--bad); border-color: rgba(242,86,75,.5); }
.cm-act { display: flex; align-items: center; gap: 5px; margin-top: 4px; flex-wrap: wrap; font-size: 12px; }
.cm-act a { margin-right: auto; }
.src-sm { color: var(--dim); font-size: 11px; }

/* Alternativen / Suche */
.picker { margin-top: 7px; border-top: 1px solid var(--border); padding-top: 6px; }
.pk-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 2px 0 4px; }
.pk-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 4px; }
.pk-msg { color: var(--dim); font-size: 12px; padding: 2px 0; }
.opt {
  display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 6px; align-items: center; text-align: left;
  background: #262932; border: 1px solid var(--border); border-radius: 4px; padding: 3px; cursor: pointer; min-width: 0;
}
.opt:hover:not(:disabled), .opt:focus-visible { border-color: var(--accent); background: #2d3240; outline: none; }
.opt:disabled { opacity: .5; cursor: default; }
.opt .img { width: 34px; border-radius: 3px; }
.opt-t { min-width: 0; }
.opt-n { font-weight: 600; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opt-s { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opt-p { color: var(--dim); font-size: 11px; }
.opt.current { border-color: rgba(63,185,80,.6); }
.search { display: flex; gap: 4px; margin: 7px 0 4px; }
.search input, .search select {
  background: #1b1c22; border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px; min-width: 0;
}
.search input { flex: 1 1 auto; }
.search input:focus, .search select:focus { outline: none; border-color: var(--accent); }
.pk-foot { display: flex; justify-content: flex-end; margin-top: 5px; }

footer { color: var(--dim); font-size: 11px; padding: 8px 8px 12px; border-top: 1px solid #2a2c34; margin-top: 8px; }

#toast {
  position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 20; display: flex; justify-content: center; pointer-events: none;
}
#toast div {
  background: #3a2326; border: 1px solid rgba(242,86,75,.6); color: #ffd2ce; padding: 6px 10px; border-radius: 5px;
  font-size: 12px; max-width: 420px; box-shadow: 0 4px 14px rgba(0,0,0,.4); opacity: 0; transform: translateY(6px);
  transition: opacity .2s, transform .2s;
}
#toast div.ok { background: #1f3326; border-color: rgba(63,185,80,.6); color: #c9f0d1; }
#toast div.show { opacity: 1; transform: none; }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="status"><span class="dot" id="dot"></span><span class="status-text" id="status">Verbinde …</span></div>
    <span class="learned" id="learned" hidden></span>
  </div>
  <div class="hrow ctrl">
    <span id="src-wrap" hidden>Quelle <select id="src" aria-label="Quelle"></select></span>
    <span class="spacer"></span>
    <label><input type="checkbox" id="unsure"> nur unsichere</label>
  </div>
</header>
<div class="offline" id="offline" hidden>Engine nicht erreichbar – startet OBS-Filter? Neuer Versuch läuft …</div>
<main id="main">
  <section id="sec-confirm" hidden>
    <h2>Bitte bestätigen <span class="count" id="cnt-confirm">0</span></h2>
    <div class="grid grid-confirm" id="grid-confirm"></div>
  </section>
  <section id="sec-seen">
    <h2>Erkannt <span class="count" id="cnt-seen">0</span></h2>
    <div class="grid grid-seen" id="grid-seen"></div>
    <div class="empty" id="empty-seen" hidden>Keine Karten im Bild.</div>
  </section>
</main>
<footer>Bestätigungen werden lokal gelernt und als Trainingsdaten gespeichert.</footer>
<div id="toast" aria-live="polite"></div>

<script>
'use strict';
(function () {
  var POLL_MS = 500, POLL_FAIL_MS = 1500, HL_MS = 1500, SEARCH_MS = 300;

  // ---------- Hilfsfunktionen ----------
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function setText(node, t) {
    t = t == null ? '' : String(t);
    if (node.textContent !== t) node.textContent = t;
  }
  function show(node, on) { on = !!on; if (node.hidden === on) node.hidden = !on; }
  function cls(node, c, on) { node.classList.toggle(c, !!on); }
  function refs(root) {
    var r = {};
    root.querySelectorAll('[data-r]').forEach(function (n) { r[n.getAttribute('data-r')] = n; });
    return r;
  }
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { /* egal */ } }
  };

  var moneyFmt = {};
  function money(v, cur) {
    cur = cur || 'EUR';
    try {
      if (!moneyFmt[cur]) moneyFmt[cur] = new Intl.NumberFormat('de-DE', { style: 'currency', currency: cur });
      return moneyFmt[cur].format(v);
    } catch (e) { return Number(v).toFixed(2).replace('.', ',') + ' ' + cur; }
  }
  var pctFmt = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 1, minimumFractionDigits: 1 });
  function pct(sim) {
    if (typeof sim !== 'number' || !isFinite(sim)) return '';
    return Math.round(sim * 100) + ' %';
  }
  function metaLine(c) {
    var parts = [];
    var set = c.set_name || '';
    if (c.set_code) set = set ? set + ' (' + c.set_code + ')' : c.set_code;
    if (set) parts.push(set);
    if (c.number) parts.push('Nr. ' + c.number);
    return parts.join(' · ');
  }
  function labelCmp(a, b) {
    var la = String(a || ''), lb = String(b || '');
    return la.length - lb.length || (la < lb ? -1 : la > lb ? 1 : 0);
  }

  // Bild-Box: <div class="img missing"><img></div>; lädt nur neu, wenn sich die URL ändert, ohne Flackern.
  function imgBox(extra) {
    var box = el('div', 'img missing' + (extra ? ' ' + extra : ''));
    var img = el('img');
    img.loading = 'lazy';
    img.decoding = 'async';
    img.alt = '';
    img.addEventListener('load', function () { box.classList.remove('missing'); });
    img.addEventListener('error', function () { box.classList.add('missing'); });
    box.appendChild(img);
    box._url = undefined;
    return box;
  }
  function setImg(box, url) {
    url = url || null;
    if (box._url === url) return;
    box._url = url;
    var img = box.firstElementChild;
    if (!url) { img.removeAttribute('src'); box.classList.add('missing'); return; }
    if (!img.getAttribute('src') || box.classList.contains('missing')) { img.src = url; return; }
    // Vorladen, dann tauschen – so bleibt das alte Bild bis zum Wechsel stehen.
    var pre = new Image();
    pre.onload = pre.onerror = function () { if (box._url === url) img.src = url; };
    pre.src = url;
  }

  // ---------- Toast ----------
  var toastBox = $('toast'), toastTimer = null;
  function toast(msg, kind) {
    toastBox.textContent = '';
    var d = el('div', kind === 'ok' ? 'ok' : '', msg);
    toastBox.appendChild(d);
    requestAnimationFrame(function () { d.classList.add('show'); });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { d.classList.remove('show'); }, kind === 'ok' ? 1800 : 4000);
  }

  // ---------- Netzwerk ----------
  function fetchJson(url, opts, timeoutMs) {
    opts = opts || {};
    var ctl = typeof AbortController === 'function' ? new AbortController() : null;
    var to = ctl ? setTimeout(function () { ctl.abort(); }, timeoutMs || 4000) : null;
    if (ctl) opts.signal = ctl.signal;
    opts.cache = 'no-store';
    return fetch(url, opts).then(function (r) {
      return r.json().catch(function () { return null; }).then(function (j) {
        if (to) clearTimeout(to);
        return { ok: r.ok, status: r.status, json: j };
      });
    }, function (e) { if (to) clearTimeout(to); throw e; });
  }
  function post(path, body) {
    return fetchJson(path, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    }, 6000).then(function (r) {
      if (!r.ok || !r.json || r.json.ok === false) {
        throw new Error((r.json && r.json.error) || ('HTTP ' + r.status));
      }
      return r.json;
    });
  }
  function postQuiet(path, body) {
    return post(path, body).then(function () { pollNow(); }, function () { /* Highlight-Fehler still ignorieren */ });
  }

  // ---------- Zustand ----------
  // Grundsätze (siehe Kopf von docs/DOCK.md):
  // - Eine gestellte Frage („Bitte bestätigen“) ist klebrig: sie bleibt, bis der Nutzer antwortet, die Karte
  //   > ASK_GONE_MS fehlt oder sie ASK_SAFE_MS am Stück sicher erkannt ist (und niemand mit ihr arbeitet).
  // - Fehlt eine Karte kurz (oder ist "rejected"), bleibt die Kachel ausgegraut mit letztem Inhalt stehen.
  // - Kacheln, mit denen der Nutzer arbeitet (Maus, Fokus, Suchtext, geöffnete Liste), sind eingefroren:
  //   kein Inhaltswechsel, kein Neuaufbau, keine Positionsänderung; vor ihnen wird nichts eingefügt/entfernt.
  // - Zeitregeln zählen nur erfolgreiche Abfragen (lastOkAt) – ein Engine-Aussetzer räumt nichts ab.
  var MISSING_MAX_MS = 120000;  // Obergrenze, auch für eingefrorene Kacheln (ohne Eingabe)
  var ASK_GONE_MS = 20000, ASK_SAFE_MS = 10000, SEEN_GONE_MS = 4000, THAW_MS = 1500,
      CONFIRM_GRACE_MS = 8000, DISMISS_MS = 5000, POLL_TIMEOUT_MS = 3000;
  var state = null, failCount = 0, pollTimer = null, inflight = false, again = false, everOk = false, lastOkAt = 0;
  var selSession = store.get('tcl.dock.session', '*');
  var onlyUnsure = store.get('tcl.dock.unsure', '0') === '1';
  var tiles = new Map();                    // "session|track" -> Kachel-Objekt (überlebt Moduswechsel)
  var orders = { confirm: [], compact: [] }; // Reihenfolge je Abschnitt
  var dismissed = new Map();                // vom Nutzer verworfene Karten -> Zeitpunkt
  var view = { active: null, multi: false, sessions: 0 };
  var filterDirty = false;

  var ui = {
    dot: $('dot'), status: $('status'), learned: $('learned'), srcWrap: $('src-wrap'), src: $('src'),
    unsure: $('unsure'), offline: $('offline'), main: $('main'),
    secConfirm: $('sec-confirm'), gridConfirm: $('grid-confirm'), cntConfirm: $('cnt-confirm'),
    secSeen: $('sec-seen'), gridSeen: $('grid-seen'), cntSeen: $('cnt-seen'), emptySeen: $('empty-seen')
  };
  ui.unsure.checked = onlyUnsure;
  ui.unsure.addEventListener('change', function () {
    onlyUnsure = ui.unsure.checked;
    store.set('tcl.dock.unsure', onlyUnsure ? '1' : '0');
    filterDirty = true;
    if (everOk) layout();
  });
  ui.src.addEventListener('change', function () {
    selSession = ui.src.value;
    store.set('tcl.dock.session', selSession);
    filterDirty = true;
    if (everOk) { renderHead(); layout(); }
  });

  var dockRev = null;
  function poll() {
    clearTimeout(pollTimer);
    if (inflight) { again = true; return; }
    inflight = true;
    fetchJson('/api/state', {}, POLL_TIMEOUT_MS).then(function (r) {
      if (!r.ok || !r.json || typeof r.json !== 'object') throw new Error('HTTP ' + r.status);
      state = r.json; failCount = 0; everOk = true; lastOkAt = Date.now();
      // Neue Dock-Version in der Engine → Seite neu laden (nicht während einer Eingabe)
      if (state.dock_rev) {
        if (dockRev === null) dockRev = state.dock_rev;
        else if (dockRev !== state.dock_rev && !(document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))) {
          location.reload(); return;
        }
      }
      ingest(state);
      renderHead();
      layout();
    }).catch(function (e) {
      failCount++;
      if (e && !(e.name === 'AbortError' || /^HTTP /.test(e.message || '') || e instanceof TypeError) && window.console) {
        console.error(e); // Programmfehler nicht verschlucken
      }
      renderOffline();
    }).then(function () {
      inflight = false;

  // ---------- Hervorheben ----------

    var send = function () {

    var hovered = t.el.matches(':hover') && Date.now() - lastMouseMove < HOVER_STALE_MS;

    e.classList.add('busy');
    var btns = Array.prototype.slice.call(e.querySelectorAll('button'));
    btns.forEach(function (b) { b.disabled = true; });
    return post(path, body).then(function () {
      if (okMsg) toast(okMsg, 'ok');

    }, function (err) {
      toast('Fehler: ' + (err && err.message ? err.message : 'Anfrage fehlgeschlagen'));
      return false;
    }).then(function (ok) {

  function confirmKey(t, key, opt) {

  // ---------- Alternativen / Suche ----------

  function makePicker(t) {

  // ---------- Kacheln ----------

  function newTile(key, sid, track) {

  // Baut das DOM einer Kachel für einen Modus (nur bei Moduswechsel – nie für eingefrorene Kacheln).

  // Zustandsanzeige – darf sich auch bei eingefrorenen Kacheln ändern (ändert keine Positionen).
  function status(t) {
    var r = t.r, missing = t.missingSince != null;
    cls(t.el, 'gone', missing);
    cls(t.el, 'checking', !missing && t.recheck);
    var note = missing ? 'Karte wird gerade neu geprüft …' : t.recheck ? 'wird neu geprüft …' :
      (t.mode === 'confirm' && t.sticky ? 'wartet auf deine Antwort' : '');
    setText(r.note, note);
    show(r.note, !!note);
    var hl = t.ses && t.ses.highlight, lab = (t.shown || t.latest || {}).label;
    cls(t.el, 'hl', !!hl && hl === lab);
    var a = t.shown, b = t.latest;
    show(r.newsug, !!(t.frozen && a && b && a !== b && (a.key !== b.key || a.name !== b.name)));
  }

  function isUnsure(c) {
    return !!c.needs_confirmation || c.state === 'uncertain' || c.state === 'failed';
  }
  function cmpTile(a, b) {
    return (a.sesIdx - b.sesIdx) || labelCmp(a.label, b.label) || (a.track > b.track ? 1 : a.track < b.track ? -1 : 0);
  }
  function maxFrozen(arr) {
    for (var i = arr.length - 1; i >= 0; i--) if (arr[i].frozen && arr[i].visible) return i;
    return -1;
  }
  // Darf t seinen Abschnitt verlassen bzw. ausgeblendet werden, ohne dass eine eingefrorene Kachel springt?
  function canLeave(t) {
    if (!t.visible) return true;
    var arr = orders[t.mode], i = arr.indexOf(t);
    if (i < 0) return true;
    if (i <= maxFrozen(arr)) return false;
    if (t.mode === 'confirm' && maxFrozen(orders.compact) >= 0) return false; // Erkannt-Abschnitt würde hochrutschen
    return true;
  }
  // Einfügen: sortiert nach Kennzeichen, aber nie vor einer eingefrorenen Kachel.
  function insertSorted(arr, t) {
    var i = maxFrozen(arr) + 1;
    for (; i < arr.length; i++) if (cmpTile(arr[i], t) > 0) break;
    arr.splice(i, 0, t);
  }

  function desired(t) {
    if (t.dismissed) return 'gone';
    var miss = t.missingSince == null ? 0 : lastOkAt - t.missingSince;
    var typing = t.el && t.picker && (t.picker.r.q.value.trim() !== '' || t.el.contains(document.activeElement));
    if (miss > MISSING_MAX_MS && !typing) return 'gone';
    if (t.asked) {
      if (miss > ASK_GONE_MS && !t.frozen) return 'gone';
      if (t.safeSince != null && lastOkAt - t.safeSince >= ASK_SAFE_MS && !t.frozen) t.asked = false;
      else return 'confirm';
    }
    if (miss > SEEN_GONE_MS && !t.frozen) return 'gone';
    return 'compact';
  }

  // Übernimmt eine erfolgreiche /api/state-Antwort in die Kachel-Modelle (ohne DOM).
  var engineInstance = null;
  function ingest(s) {
    var now = Date.now(), seen = new Set();
    if (s.instance && engineInstance !== s.instance) {
      if (engineInstance !== null) {
        tiles.forEach(function (t) { if (t.el && t.el.parentNode) t.el.parentNode.removeChild(t.el); });
        tiles.clear(); dismissed.clear();
      }
      engineInstance = s.instance;
    }
    var sessions = Array.isArray(s.sessions) ? s.sessions : [];
    dismissed.forEach(function (at, key) { if (now - at > 600000) dismissed.delete(key); });
    sessions.forEach(function (ses, si) {
      if (!ses) return;
      (Array.isArray(ses.cards) ? ses.cards : []).forEach(function (c) {
        if (!c || c.track == null) return;
        var key = ses.id + '|' + c.track;
        var rejected = c.state === 'rejected';
        var d = dismissed.get(key);
        if (d != null) {
          if (rejected || now - d < DISMISS_MS) return;
          dismissed.delete(key); // Engine fragt erneut
        }
        var t = tiles.get(key);
        if (!t) {
          if (rejected) return;
          t = newTile(key, ses.id, c.track);
          tiles.set(key, t);
        }
        t.ses = ses; t.sesIdx = si;
        if (rejected) return; // wie „fehlt“: ausgegraut stehen lassen
        seen.add(key);
        t.latest = c;
        if (c.label) t.label = c.label;
        t.missingSince = null;
        t.recheck = !!c.recheck;
        t.sticky = !!c.sticky;
        var grace = t.userConfirmedAt && now - t.userConfirmedAt < CONFIRM_GRACE_MS;
        if ((c.needs_confirmation || c.sticky) && !grace) t.asked = true;
        var safe = !c.sticky && (!c.needs_confirmation || !!c.confirmed);
        if (safe) { if (t.safeSince == null) t.safeSince = now; }
        else t.safeSince = null;
      });
    });
    tiles.forEach(function (t, key) {
      if (seen.has(key)) return;
      if (t.missingSince == null) t.missingSince = now;
      t.safeSince = null;
    });
  }

  var srcSig = null;
  function renderHead() {
    var s = state || {};
    var sessions = Array.isArray(s.sessions) ? s.sessions : [];
    show(ui.offline, false);
    ui.dot.className = 'dot ok';
    setText(ui.status, (s.status || 'verbunden') + (s.engine ? ' · Engine ' + s.engine : ''));
    var L = s.learned;
    if (L && typeof L.references === 'number') {
      show(ui.learned, true);
      ui.learned.innerHTML = '';
      ui.learned.appendChild(el('b', null, String(L.references)));
      ui.learned.appendChild(document.createTextNode(L.references === 1 ? ' Referenz gelernt' : ' Referenzen gelernt'));
      ui.learned.title = 'Gelernte Referenzen: ' + L.references +
        (typeof L.negatives === 'number' ? ' · Negativbeispiele: ' + L.negatives : '') +
        (typeof L.dataset === 'number' ? ' · Trainingsbeispiele: ' + L.dataset : '');
    } else show(ui.learned, false);

    var sig = sessions.map(function (x) { return x.id + '\u0001' + (x.source || ''); }).join('\u0002');
    if (sig !== srcSig && document.activeElement !== ui.src) {
      srcSig = sig;
      ui.src.textContent = '';
      var all = el('option', null, 'Alle Quellen'); all.value = '*'; ui.src.appendChild(all);
      sessions.forEach(function (x) { var o = el('option', null, x.source || x.id); o.value = x.id; ui.src.appendChild(o); });
      var known = selSession === '*' || sessions.some(function (x) { return x.id === selSession; });
      ui.src.value = known ? selSession : '*';
    }
    show(ui.srcWrap, sessions.length > 1);
    var active = null;
    if (sessions.length > 1 && selSession !== '*' && sessions.some(function (x) { return x.id === selSession; })) {
      active = new Set([selSession]);
    }
    view.active = active;
    view.multi = !active && sessions.length > 1;
    view.sessions = sessions.length;
  }

  function wantVisible(t) {
    if (view.active && !view.active.has(t.sid)) return false;
    if (t.mode === 'compact' && onlyUnsure) return isUnsure(t.shown || t.latest || {});
    return true;
  }

  // Entfernt fremde Knoten und ordnet nur dort um, wo es nötig ist (vorhandene Knoten bleiben stehen).
  function place(grid, arr) {
    var want = new Set(arr.map(function (t) { return t.el; }));
    Array.prototype.slice.call(grid.children).forEach(function (n) { if (!want.has(n)) grid.removeChild(n); });
    var ref = grid.firstElementChild;
    arr.forEach(function (t) {
      var n = t.el;
      if (n === ref) { ref = ref.nextElementSibling; return; }
      grid.insertBefore(n, ref);
    });
  }

  function layout() {
    // Anker: erste eingefrorene Kachel – falls sich darüber doch etwas verschiebt, wird nachgescrollt.
    var anchor = null, top0 = 0;
    tiles.forEach(function (t) { if (!anchor && t.frozen && t.visible && t.el && t.el.isConnected) anchor = t; });
    if (anchor) top0 = anchor.el.getBoundingClientRect().top;

    // 1. Abschnittswechsel / Entfernen
    Array.from(tiles.values()).forEach(function (t) {
      var want = desired(t), cur = t.mode;
      if (want === cur) { t.forced = false; return; }
      if (cur && !t.forced && (t.frozen || !canLeave(t))) return;
      t.forced = false;
      if (cur) { var arr = orders[cur], i = arr.indexOf(t); if (i >= 0) arr.splice(i, 1); }
      if (want === 'gone') { destroy(t); return; }
      buildEl(t, want);
      insertSorted(orders[want], t);
    });

    // 2. Inhalt (nur nicht eingefrorene), Zustand, Sichtbarkeit
    ['confirm', 'compact'].forEach(function (m) {
      orders[m].forEach(function (t) {
        if (!t.frozen || !t.shown || t.freshUntil > Date.now()) applyContent(t);
        status(t);
        var v = wantVisible(t);
        if (v === t.visible) return;
        if (v) {
          var arr = orders[m];
          if (!filterDirty && arr.indexOf(t) < maxFrozen(arr)) return; // würde eingefrorene Kachel verschieben
        } else if (!filterDirty && (t.frozen || !canLeave(t))) return;
        t.visible = v;
        t.el.hidden = !v;
      });
    });
    filterDirty = false;

    // 3. DOM
    place(ui.gridConfirm, orders.confirm);
    place(ui.gridSeen, orders.compact);
    var nC = orders.confirm.filter(function (t) { return t.visible; }).length;
    var nS = orders.compact.filter(function (t) { return t.visible; }).length;
    show(ui.secConfirm, nC > 0);
    setText(ui.cntConfirm, nC);
    setText(ui.cntSeen, nS);
    show(ui.emptySeen, nS === 0 && nC === 0);
    show(ui.secSeen, nS > 0 || nC === 0);
    setText(ui.emptySeen, onlyUnsure && tiles.size > 0 ? 'Keine unsicheren Karten.' :
      view.sessions === 0 ? 'Keine Quelle aktiv – Filter „TCG Card Lens“ in OBS hinzufügen.' : 'Keine Karten im Bild.');

    if (anchor && anchor.el && anchor.el.isConnected) {
      var d = anchor.el.getBoundingClientRect().top - top0;
      if (Math.abs(d) > 0.5) window.scrollBy(0, d);
    }
  }

  window.addEventListener('beforeunload', function () { if (hover) hlStop(); });
  poll();
})();
</script>
</body>
</html>
